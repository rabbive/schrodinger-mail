apiVersion: v1
kind: Service
metadata:
  name: schrodinger-mail
  namespace: schrodinger-mail
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: schrodinger-mail
  ports:
    - port: 80
      targetPort: 5001
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: schrodinger-mail
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: schrodinger-mail
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schrodinger-mail
  namespace: schrodinger-mail
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mail.example.com
      secretName: schrodinger-mail-tls
  rules:
    - host: mail.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: schrodinger-mail
                port:
                  number: 80
