apiVersion: apps/v1
kind: Deployment
metadata:
  name: schrodinger-mail
  namespace: schrodinger-mail
  labels:
    app.kubernetes.io/name: schrodinger-mail
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: schrodinger-mail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schrodinger-mail
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: schrodinger-mail:latest
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - configMapRef:
                name: schrodinger-mail-config
            - secretRef:
                name: schrodinger-mail-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/auth/status
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/auth/status
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: schrodinger-mail
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: schrodinger_mail
            - name: POSTGRES_USER
              value: qec
            - name: POSTGRES_PASSWORD
              value: password
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: postgres-pvc
