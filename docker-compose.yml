# Schrödinger Mail — Docker Compose
# ==============================================
# Usage: docker compose up --build
# Then open https://localhost (with TLS) or http://localhost:5001 (direct)

services:
  # ── Application ──────────────────────────────────────────────────
  app:
    build: .
    container_name: schrodinger-mail
    ports:
      - "5001:5001"
    environment:
      - QEC_SECRET_KEY=${QEC_SECRET_KEY:-quantum-docker-secret-change-me}
      - QEC_JWT_SECRET=${QEC_JWT_SECRET:-quantum-jwt-secret-change-me}
      - QEC_PORT=5001
      - QEC_DEBUG=0
      - QEC_LOG_LEVEL=INFO
      - QEC_LOG_FORMAT=json
      - QEC_METRICS=1
      - QEC_ZK_MODE=${QEC_ZK_MODE:-0}
      - QEC_FORWARD_SECRECY=${QEC_FORWARD_SECRECY:-0}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/quantum_email.db}
    volumes:
      - qec-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/auth/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ── PostgreSQL (optional, for production) ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: schrodinger-postgres
    environment:
      - POSTGRES_DB=schrodinger_mail
      - POSTGRES_USER=qec
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-qec-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qec -d schrodinger_mail"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # ── Nginx TLS Reverse Proxy (optional) ──────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: schrodinger-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - tls

volumes:
  qec-data:
    driver: local
  pg-data:
    driver: local
